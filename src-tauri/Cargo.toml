[package]
name = "chaty"
version = "1.7.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chaty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU offload. On by default; build with `--no-default-features` for a pureâ€‘CPU
# build (no Vulkan SDK needed on Windows/Linux). The backend is target-
# conditional â€” Vulkan on Windows/Linux, Metal on macOS â€” routed through the
# `gpu-backend` shim crate, because a cargo feature can't map to different
# dependency features per target. See gpu-backend/Cargo.toml.
default = ["gpu"]
gpu = ["dep:chaty-gpu-backend"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
async-trait = "0.1"
anyhow = "1"
# Base llama.cpp binding (CPU). The GPU backend feature (vulkan/metal) is added
# per-target by the `gpu-backend` shim when the `gpu` feature is on.
llama-cpp-2 = { version = "0.1.150", features = ["sampler", "mtmd"] }
chaty-gpu-backend = { path = "gpu-backend", optional = true }
sysinfo = "0.32"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
scraper = "0.23"
percent-encoding = "2"
pdf-extract = "0.7"
ocrs = "0.12.2"
rten = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
sherpa-rs = "0.6.8"
tar = "0.4"
bzip2 = "0.4"
base64 = "0.22"
libc = "0.2"
# .docx text extraction (OOXML is a zip of XML parts).
zip = { version = "2", default-features = false, features = ["deflate"] }
# .xlsx spreadsheet reading (handles shared strings, numbers, dates).
calamine = "0.26"
# Agentic coding tools: file glob + content grep over the workspace.
glob = "0.3"
regex = "1"
walkdir = "2"
htmd = "0.5.4"
dom_smoothie = "0.18.0"
url = "2.5.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# GPU VRAM detection (DXGI) for auto-tuning n_gpu_layers â€” cross-vendor on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# macOS: Metal device query (recommendedMaxWorkingSetSize) for the offload
# budget, AVFoundation for the app-level microphone consent prompt (TCC), and
# cpal (CoreAudio) for native mic capture — WKWebView's getUserMedia never
# exposes capture devices to embedded apps, so recording bypasses it entirely.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
cpal = "0.15"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
    "std",
] }

