[package]
name = "chaty"
version = "0.3.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chaty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU offload via the Vulkan backend (crossâ€‘vendor). On by default; build with
# `--no-default-features` for a pureâ€‘CPU build that doesn't need the Vulkan SDK.
default = ["gpu"]
gpu = ["llama-cpp-2/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
async-trait = "0.1"
anyhow = "1"
llama-cpp-2 = { version = "0.1.146", features = ["sampler"] }
sysinfo = "0.32"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
scraper = "0.23"
percent-encoding = "2"
pdf-extract = "0.7"
ocrs = "0.12.2"
rten = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
sherpa-rs = "0.6.8"
tar = "0.4"
bzip2 = "0.4"
base64 = "0.22"

# GPU VRAM detection (DXGI) for auto-tuning n_gpu_layers â€” cross-vendor on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

