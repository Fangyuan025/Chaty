[package]
name = "chaty"
version = "2.3.0"
# Two binaries live here (the app + the bench/headless tool server) — `cargo
# run`, which `tauri dev` invokes, needs to know the app is the default.
default-run = "chaty"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chaty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU offload. On by default; build with `--no-default-features` for a pureâ€‘CPU
# build (no Vulkan SDK needed on Windows/Linux). The backend is target-
# conditional â€” Vulkan on Windows/Linux, Metal on macOS â€” routed through the
# `gpu-backend` shim crate, because a cargo feature can't map to different
# dependency features per target. See gpu-backend/Cargo.toml.
default = ["gpu"]
gpu = ["dep:chaty-gpu-backend"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
async-trait = "0.1"
anyhow = "1"
# Base llama.cpp binding (CPU). The GPU backend feature (vulkan/metal) is added
# per-target by the `gpu-backend` shim when the `gpu` feature is on.
#
# Pinned to a git revision rather than the crates.io release: 0.1.154 is the
# latest published version and its vendored llama.cpp predates
# `LLM_ARCH_MUSE_GLIMMER`, so Muse-Glimmer GGUFs cannot load at all. The
# crate's own main branch already tracks a llama.cpp that has it.
# Fork of utilityai/llama-cpp-rs at 3d5f424 plus one commit: `load_mtp` and
# `n_layer_nextn` were not reachable from the safe API, so the MTP draft
# context the crate can already drive could never actually be built.
# Its llama.cpp submodule points at Fangyuan025/llama.cpp chaty/k2-horizon:
# the same llama.cpp revision with K2 Horizon backported on top from
# MBZUAI-IFM's branch (the one IFM's own GGUFs name) until upstream has it.
llama-cpp-2 = { git = "https://github.com/Fangyuan025/llama-cpp-rs", rev = "01da17ebc56d54ac0abccc55daaa424bd5368528", features = ["sampler", "mtmd"] }
# The same crate llama-cpp-2 is built on (same revision, so nothing extra is
# compiled): reached directly for `llama_log_set`, so llama.cpp's own reason
# for refusing a model can be kept instead of discarded with the rest of its
# log.
llama-cpp-sys-2 = { git = "https://github.com/Fangyuan025/llama-cpp-rs", rev = "01da17ebc56d54ac0abccc55daaa424bd5368528" }
# A real Jinja engine for GGUF chat templates. llama.cpp's own
# `llama_chat_apply_template` does not run Jinja: it recognises a template by
# substrings and prints its built-in version of that family, so anything the
# model's template does beyond the canonical format — a BOS at the start, a
# default system prompt — was silently dropped (issue #20: MiniCPM5 lost its
# BOS and answered in fragments). minijinja + pycompat is what Hugging Face's
# own TGI renders these templates with.
minijinja = { version = "2.24", features = ["loop_controls", "json", "preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
chaty-gpu-backend = { path = "gpu-backend", optional = true }
sysinfo = "0.32"
# Human-readable local timestamps in the user-attachable error log (already
# in the tree transitively — zero new weight).
chrono = "0.4"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
scraper = "0.23"
percent-encoding = "2"
pdf-extract = "0.7"
ocrs = "0.12.2"
rten = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
sherpa-rs = "0.6.8"
tar = "0.4"
bzip2 = "0.4"
# Traditional → Simplified for Whisper's Chinese transcripts (MIT; OpenCC's
# tables, phrase-aware). zhconv is GPL and could not be used.
fast2s = "0.3"
base64 = "0.22"
libc = "0.2"
# .docx text extraction (OOXML is a zip of XML parts).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Embedded-image extraction from PDFs (same lopdf pdf-extract uses).
lopdf = "0.34"
flate2 = "1" # inflate PDF image streams ourselves — lopdf's own decompress rejects Chrome-print PDFs
# .xlsx spreadsheet reading (handles shared strings, numbers, dates).
calamine = "0.26"
# Agentic coding tools: file glob + content grep over the workspace.
glob = "0.3"
regex = "1"
walkdir = "2"
htmd = "0.5.4"
dom_smoothie = "0.18.0"
url = "2.5.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
hf-hub = "1.0.0"
toml = "0.8"
# Code mode's interactive commands: a terminal the model types into (ConPTY on
# Windows), and a terminal screen to read what it shows (both MIT).
portable-pty = "0.9"
vt100 = "0.16"

# GPU VRAM detection (DXGI) for auto-tuning n_gpu_layers â€” cross-vendor on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# Windows code page number → encoding, for console output that is not UTF-8
# (already in the tree through calamine).
codepage = "0.1.2"

# macOS: Metal device query (recommendedMaxWorkingSetSize) for the offload
# budget, AVFoundation for the app-level microphone consent prompt (TCC), and
# cpal (CoreAudio) for native mic capture — WKWebView's getUserMedia never
# exposes capture devices to embedded apps, so recording bypasses it entirely.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
cpal = "0.15"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
    "std",
] }

