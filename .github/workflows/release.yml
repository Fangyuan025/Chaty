# Cross-platform release: one tag → one GitHub Release carrying BOTH the
# Windows Inno installer (.exe) and the macOS disk image (.dmg).
#
# The in-app updater (src-tauri/src/update.rs) reads the *latest* release and
# picks the asset by platform extension, so keeping both installers on the same
# release is what keeps cross-platform versions in sync.
#
# Flow:
#   1. bump versions with scripts/bump-version.sh <x.y.z>
#   2. commit, tag v<x.y.z>, push the tag
#   3. this workflow builds both installers and publishes the release
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fail fast if the tag doesn't match the versions in the repo.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json / tauri.conf.json / Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG pkg=$PKG conf=$CONF cargo=$CARGO"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$CONF" ] && [ "$TAG" = "$CARGO" ] \
            || { echo "::error::version mismatch — run scripts/bump-version.sh $TAG"; exit 1; }

  build-macos:
    needs: check-version
    # macos-15: mlx-swift-lm needs Swift tools 6.1 (Xcode 16.3+), which the
    # macos-14 image never gets. Building the app against the macOS 15 SDK is
    # fine now — ggml's MTLResidencySet wired-memory balloon is disabled at
    # runtime (GGML_METAL_NO_RESIDENCY=1 set on startup, lib.rs).
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        # Don't cache target/: rust-cache prunes the ONNX Runtime dylib that
        # sherpa-rs places in target/release/ while keeping its build script
        # "fresh", so a cache-restored build fails with
        # "Library not found: target/release/libonnxruntime.*.dylib".
        with: { workspaces: src-tauri, cache-targets: false }
      - run: npm ci
      - name: Build MLX sidecar (chaty-mlx)
        # mlx-swift-lm needs Swift tools 6.1 → pick the newest Xcode 16.x on
        # the runner (NOT Xcode 26: its Metal toolchain is a separate
        # multi-hundred-MB download the CI would have to fetch every run).
        run: |
          SIDE_XCODE=$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$SIDE_XCODE" ] || SIDE_XCODE=$(dirname "$(dirname "$(xcode-select -p)")")
          echo "sidecar Xcode: $SIDE_XCODE"
          DEVELOPER_DIR="$SIDE_XCODE/Contents/Developer" ./scripts/build-mlx-sidecar.sh
      - name: Build .app (Metal)
        # Only the "app" bundle: Tauri's bundle_dmg.sh drives Finder via
        # AppleScript, which fails on headless CI runners. The extra --config
        # layer bundles the MLX sidecar (kept out of the base config so local
        # `tauri dev` works without Xcode).
        run: npm run tauri build -- --bundles app --config src-tauri/tauri.mlx.conf.json
      - name: Bundle MLX resource bundles (metallib) + re-sign
        run: ./scripts/bundle-mlx-resources.sh src-tauri/target/release/bundle/macos/Chaty.app
      - name: Package .dmg (headless hdiutil)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE=$(mktemp -d)
          cp -R src-tauri/target/release/bundle/macos/Chaty.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Chaty" -srcfolder "$STAGE" -ov -format UDZO \
            "Chaty_${VER}_aarch64.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: "*.dmg"
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: windows-latest
    env:
      # Short target dir — the Vulkan build nests past MAX_PATH otherwise.
      CARGO_TARGET_DIR: C:\ct
      CMAKE_GENERATOR: Ninja
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v5
      # A git dependency is CLONED into `.cargo/git/checkouts/...`, where
      # llama.cpp's bundled web UI nests one character past MAX_PATH. The
      # crates.io release unpacked to a shorter path, so this only starts
      # mattering once the dependency is pinned to a revision. Long paths in
      # git, and cargo's fetch handed to that git rather than to libgit2.
      - name: Allow long paths for the llama.cpp checkout
        run: git config --global core.longpaths true
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with: { version: 1.3.290.0, cache: true }
      - name: Install Ninja
        run: choco install ninja -y
      - uses: ilammy/msvc-dev-cmd@v1 # load MSVC env so CMake/Ninja can find cl.exe
      - name: Install SPIRV-Headers (newer llama.cpp Vulkan needs its CMake config package)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cmake -S SPIRV-Headers -B SPIRV-Headers/build
          cmake --install SPIRV-Headers/build --prefix "$env:VULKAN_SDK"
      - run: npm ci
      - name: Build chaty.exe (Vulkan, no bundler)
        run: npm run tauri build -- --no-bundle
        env:
          # newer llama.cpp's Vulkan backend does find_package(SPIRV-Headers/-Tools);
          # point CMake at the Vulkan SDK, which ships those config packages.
          CMAKE_PREFIX_PATH: ${{ env.VULKAN_SDK }}
      - name: Bundle Vulkan runtime loader (vulkan-1.dll)
        shell: pwsh
        run: |
          # Machines without a GPU driver (winget validation VMs, bare servers)
          # have no system vulkan-1.dll and the app fails to launch. Ship the
          # runtime loader next to the exe as a fallback (the system one wins
          # in the loader search order when present).
          $dll = Get-ChildItem -Recurse $env:VULKAN_SDK -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(x64|X64)' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) {
            # SDK archives may omit the runtime component — fetch LunarG's
            # standalone runtime zip for the same version instead.
            $ver = "1.3.290.0"
            $zip = "$env:TEMP\VulkanRT.zip"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanRT-$ver-Components.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:TEMP\VulkanRT" -Force
            $dll = Get-ChildItem -Recurse "$env:TEMP\VulkanRT" -Filter vulkan-1.dll |
              Where-Object { $_.FullName -match '(x64|X64)' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $dll) { throw "vulkan-1.dll not found (SDK + runtime zip)" }
          Copy-Item $dll C:\ct\release\vulkan-1.dll
          Write-Host "bundled $dll"
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$ver /DSrcDir=C:\ct\release src-tauri\installer\Chaty.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: C:\ct\release\bundle\inno\*.exe
          if-no-files-found: error

  build-linux:
    needs: check-version
    # Ubuntu 22.04: Tauri v2 needs webkit2gtk-4.1, and building against the
    # OLDEST supported glibc is what makes the AppImage run on newer distros
    # too (the reverse never works).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # cache-targets: false for the same reason as build-macos: rust-cache
        # prunes the sherpa-onnx/onnxruntime shared libs that sherpa-rs-sys'
        # build script drops into target/release while keeping the script
        # "fresh", so the SECOND release run (first with a warm cache) dies at
        # link time with "unable to find library -lonnxruntime". Windows is
        # naturally immune: CARGO_TARGET_DIR=C:\ct sits outside the cached
        # workspace, so its target is never cached in the first place.
        with: { workspaces: src-tauri, cache-targets: false }
      - name: System deps (Tauri v2 + Vulkan for llama.cpp)
        run: |
          # glslc is NOT in Ubuntu 22.04's own archive (first Linux release
          # run found out the hard way) — llama.cpp's Vulkan backend needs it
          # to compile shaders, and LunarG's repo is where it lives.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          # The runner preinstalls libunwind-14-dev, which is mutually
          # exclusive with the libunwind-dev that gstreamer's DEV packages
          # drag in ("held broken packages", round five). The bundling
          # plugin only COPIES runtime libraries, so dev packages aren't
          # needed at all — install the runtime set, and drop the conflicting
          # preinstall for good measure.
          sudo apt-get remove -y 'libunwind-14-dev' || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev ninja-build vulkan-sdk libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-gl
      - run: npm ci
      - name: Build AppImage (Vulkan)
        run: npm run tauri build -- --verbose --bundles appimage
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE by
          # default (round two of the first Linux release found this).
          # libfuse2 above covers mounting; this covers it even without.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          # sherpa-rs (voice) emits libsherpa-onnx-c-api.so & friends into
          # target/release — the binary links fine, but linuxdeploy resolves
          # dependencies from standard paths only and died on exactly this
          # ('Could not find dependency', round six's verbose forensics).
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/release
      - name: Forensics when linuxdeploy dies silently
        if: failure()
        run: |
          set -x
          # Re-run the REAL bundling command by hand with output visible: the
          # AppDir tauri assembled is still on disk, and plugin-script errors
          # (the usual killer) only show up this way.
          APPDIR=$(ls -d src-tauri/target/release/bundle/appimage/*.AppDir 2>/dev/null | head -1) || true
          ls -la "$APPDIR" 2>/dev/null || true
          cd src-tauri/target/release/bundle/appimage 2>/dev/null && \
            env APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=true OUTPUT=forensic.AppImage \
              PATH="$HOME/.cache/tauri:$PATH" \
              ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
                --appdir "$(basename "$APPDIR")" \
                --plugin gtk --plugin gstreamer --output appimage || true
      - uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { merge-multiple: true, path: dist }
      - name: Create GitHub Release with both installers
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## A long run that stops starting over

            A prompt is resumed from the engine's cache up to the first token
            that differs from last time. On the architectures the Qwen3.5
            family uses that is all-or-nothing: three quarters of their layers
            keep a recurrent state that cannot be rewound to a midpoint, so
            anything the cache cannot account for throws all of it away and the
            conversation is read from the beginning. Six things in code mode
            were doing exactly that.

            The clock sat in the system prompt, to the minute, so a turn that
            began in a new minute matched about twenty tokens and re-read the
            rest. The answer that ended a turn was never written down, so every
            continuation started cold — and the model could not see what it had
            last told you. Tool results arrived as if you had typed them, which
            a Qwen3.5 template counts as a new request: the model would
            announce that you had sent one halfway through the work it was
            already doing, and repeat your request back at you. The closing tag
            of a tool call went missing, and one round threw away 5006 cached
            tokens over the four it could not account for. Two paths recorded a
            turn their own way. And a repeated call — usually progress,
            re-running the tests after an edit — turned reasoning off for one
            step, which re-renders the whole history, and then back again.

            After: a median of 99% of each prompt resumed from cache on both
            engines, across turn boundaries as well as within a turn. A first
            turn still costs a full read, so does a conversation crossing the
            point where its history must be compacted, and so does the first
            turn after the app restarts — the cache lives in memory and does
            not outlive the process. The turn after that resumes 99% again.

            ## Speculative decoding, on models that bring their own head

            Some checkpoints carry a small block trained to guess the tokens
            the model is about to produce. The model then checks a whole run of
            guesses in one pass instead of one pass per token, and every token
            that survives is one its own sampler drew — the reply is the reply
            it would have given either way. Both engines can drive it now.

            It ships off, and marked experimental. Measured, it is a large win
            on text whose continuation is obvious and roughly a wash on
            ordinary prose, and nothing readable before a reply starts says
            which one it will be; a default that is sometimes slower is not a
            default. The switch is in Settings → Model, offered only on models
            that actually carry a head — read from the file, not assumed.

            Three things that reached v2.1.6 as a rebuild are in here for
            anyone who installed that version on release day: a chat reply now
            survives the interface reloading under it, the composer stops
            losing a line to a scrollbar at 110% and 120% UI scale, and the
            error log can be emptied from Settings.

            <!-- Highlights go above this line, hand-written per release —
                 the release page is where people who found Chaty through a
                 model's name land, and a bare install table tells them
                 nothing about why this version exists. -->

            ## Install

            | Platform | File |
            |---|---|
            | **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |
            | **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |
            | **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run. First Linux release — please report anything odd |

            ### ⚠️ macOS first launch — "Apple could not verify…" / "damaged"

            Chaty is **ad-hoc signed but not notarized** (no paid Apple Developer
            account), so Gatekeeper flags it on first launch. The app is safe —
            everything runs locally. Clear the download quarantine once, in Terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Chaty.app
            ```

            Then open Chaty normally. (Alternatively: try to open it once, then go to
            **System Settings → Privacy & Security → Open Anyway**.)

            ---
