name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-tests:
    name: Unit tests (backend)
    # Apple Silicon so the default Metal feature builds (mirrors release.yml).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Don't cache target/: rust-cache prunes the ONNX Runtime dylib that
        # sherpa-rs places in target/release/, breaking the link (same gotcha as
        # release.yml).
        with: { workspaces: src-tauri, cache-targets: false }
      # Build in release so sherpa-rs lays down libonnxruntime in target/release/
      # (its build script only populates the release dir, which the link step
      # expects — a debug `cargo test` can't find it on a clean runner).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --release
