name: ci

# Docs-only changes (READMEs, CHANGELOG, docs/ incl. screenshots) don't touch
# anything CI builds — skip the run entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # `npm run build` = `tsc && vite build`. This type-checks AND actually
      # bundles — catching Vite failures (bad asset / dynamic-import paths, env
      # issues) that a bare `tsc --noEmit` misses and that would otherwise only
      # surface at release time inside `tauri build`.
      - name: Build frontend
        run: npm run build

  backend:
    name: Lint & unit tests (backend)
    # Apple Silicon so the default Metal feature builds (mirrors release.yml).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        # Don't cache target/: rust-cache prunes the ONNX Runtime dylib that
        # sherpa-rs places in target/release/, breaking the link (same gotcha as
        # release.yml).
        with: { workspaces: src-tauri, cache-targets: false }
      # clippy over lib, the chaty-headless bin, and tests (which
      # `cargo test --lib` never compiles). Deny only the correctness and
      # suspicious lint groups: these flag near-certain bugs (bad comparisons,
      # misused APIs, likely-wrong logic) and rarely false-positive, so they
      # gate real defects without drowning the run in style noise.
      # --release for the same reason as cargo test below: sherpa-rs only lays
      # down libonnxruntime under target/release/, and the link step looks there.
      - name: clippy (deny correctness bugs)
        working-directory: src-tauri
        run: cargo clippy --lib --bins --tests --release -- -D clippy::correctness -D clippy::suspicious
      # Build in release so sherpa-rs lays down libonnxruntime in target/release/
      # (its build script only populates the release dir, which the link step
      # expects — a debug `cargo test` can't find it on a clean runner).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --release

  linux-check:
    name: Linux compile check (CPU)
    # 22.04 matches the release job: build against the OLDEST supported glibc
    # so the AppImage also runs on newer distros. Compile-check only here —
    # the full AppImage bundle is built at release time.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, cache-targets: false }
      - name: System deps (Tauri v2 webkit + audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev
      # Same guard the Windows job gives cfg(windows) code: catch cfg(unix) /
      # cfg(target_os="linux") paths the macOS jobs compile differently (and
      # anything gated NOT-macos, which only Linux and Windows ever see).
      - name: cargo check (no GPU, all targets)
        working-directory: src-tauri
        run: cargo check --no-default-features --lib --bins --tests

  windows-check:
    name: Windows compile check (CPU)
    runs-on: windows-latest
    env:
      # Short target dir — llama.cpp nests deep and can blow past MAX_PATH even
      # without the Vulkan backend (same rationale as release.yml).
      CARGO_TARGET_DIR: C:\ct
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, cache-targets: false }
      - name: Install Ninja
        run: choco install ninja -y
      - uses: ilammy/msvc-dev-cmd@v1 # load MSVC env so CMake can find cl.exe
      # Compile-check every Windows target WITHOUT the Vulkan SDK (`--no-default-
      # features` drops GPU). This is the cheap guard for `cfg(windows)` code
      # that the macOS jobs can't even see — the class of bug (e.g. a Windows-
      # only fn referenced under the wrong cfg) that previously slipped through
      # to a release tag. Covers the chaty-headless bin too; examples are dev-only
      - name: cargo check (no GPU, all targets)
        working-directory: src-tauri
        run: cargo check --no-default-features --lib --bins --tests
