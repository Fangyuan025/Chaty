name: ci

# Docs-only changes (READMEs, CHANGELOG, docs/ incl. screenshots) don't touch
# anything CI builds — skip the run entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & type-check
    # Windows in the matrix: the dev machine is a Mac, so path separators,
    # CRLF checkouts, and case handling in the frontend/test tooling only
    # ever meet Windows here — before a release, not after.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # `npm run build` = `tsc && vite build`. This type-checks AND actually
      # bundles — catching Vite failures (bad asset / dynamic-import paths, env
      # issues) that a bare `tsc --noEmit` misses and that would otherwise only
      # surface at release time inside `tauri build`.
      - name: Build frontend
        run: npm run build
      # The frontend unit suite (agent-loop harness, wrap-up gates, i18n
      # contract, skill-bundle drift lock). This was MISSING from CI for its
      # whole life — 577 tests, including guards designed specifically to
      # turn CI red, ran only on the dev machine.
      - name: Unit tests (vitest)
        run: npx vitest run

  backend:
    name: Lint & unit tests (backend)
    # Apple Silicon so the default Metal feature builds (mirrors release.yml).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        # Don't cache target/: rust-cache prunes the ONNX Runtime dylib that
        # sherpa-rs places in target/release/, breaking the link (same gotcha as
        # release.yml).
        with: { workspaces: src-tauri, cache-targets: false }
      # clippy over lib, the chaty-headless bin, tests (which `cargo test --lib`
      # never compiles) and examples (which nothing else compiles either — a
      # signature change reached PR #8 with voicetest.rs left behind, and every
      # gate here was green). Deny only the correctness and
      # suspicious lint groups: these flag near-certain bugs (bad comparisons,
      # misused APIs, likely-wrong logic) and rarely false-positive, so they
      # gate real defects without drowning the run in style noise.
      # --release for the same reason as cargo test below: sherpa-rs only lays
      # down libonnxruntime under target/release/, and the link step looks there.
      - name: clippy (deny correctness bugs)
        working-directory: src-tauri
        run: cargo clippy --lib --bins --tests --examples --release -- -D clippy::correctness -D clippy::suspicious
      # Build in release so sherpa-rs lays down libonnxruntime in target/release/
      # (its build script only populates the release dir, which the link step
      # expects — a debug `cargo test` can't find it on a clean runner).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --release

  linux-check:
    name: Linux compile check (CPU)
    # 22.04 matches the release job: build against the OLDEST supported glibc
    # so the AppImage also runs on newer distros. Compile-check only here —
    # the full AppImage bundle is built at release time.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, cache-targets: false }
      - name: System deps (Tauri v2 webkit + audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev
      # Same guard the Windows job gives cfg(windows) code: catch cfg(unix) /
      # cfg(target_os="linux") paths the macOS jobs compile differently (and
      # anything gated NOT-macos, which only Linux and Windows ever see).
      # RUN the tests, don't just compile them — development happens on a Mac
      # with no Linux hardware, so this is the only place cfg(unix)/linux
      # behavior actually executes before a release tag.
      - name: cargo test (no GPU)
        working-directory: src-tauri
        run: cargo test --no-default-features --lib --bins

  windows-check:
    name: Windows compile check (CPU)
    runs-on: windows-latest
    env:
      # Short target dir — llama.cpp nests deep and can blow past MAX_PATH even
      # without the Vulkan backend (same rationale as release.yml).
      CARGO_TARGET_DIR: C:\ct
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, cache-targets: false }
      - name: Install Ninja
        run: choco install ninja -y
      - uses: ilammy/msvc-dev-cmd@v1 # load MSVC env so CMake can find cl.exe
      # Build and RUN the tests WITHOUT the Vulkan SDK (`--no-default-features`
      # drops GPU). Development happens on a Mac with no Windows hardware, so
      # this job is where cfg(windows) code (tasklist-based pid checks, APPDATA
      # paths, taskkill trees, the GPU crash guard) actually executes before a
      # release tag — a compile check alone let behavioral bugs through.
      - name: cargo test (no GPU)
        working-directory: src-tauri
        run: cargo test --no-default-features --lib --bins
